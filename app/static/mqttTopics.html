<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Topic Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f4f4f4; border: 1px solid #ddd; padding: 10px; overflow-x: auto; margin: 0; flex: 1; }
        #status { color: green; }
        #reconnect-status { color: orange; font-style: italic; }
        #columns { display: flex; gap: 12px; align-items: stretch; }
        .column { flex: 1; min-width: 0; display: flex; flex-direction: column; border: 1px solid #ccc; border-radius: 4px; padding: 8px; }
        .column-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .column-header label { font-size: 0.85em; color: #555; }
        .column-header select { flex: 1; }
        .remove-col { cursor: pointer; border: none; background: #e74c3c; color: #fff; border-radius: 3px; padding: 2px 8px; }
        #add-col { margin-bottom: 12px; cursor: pointer; padding: 6px 12px; }
        #add-col:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
    <script src="/static/config.js"></script>
</head>
<body>
    <p>Status: <span id="status">Connecting...</span></p>
    <p id="reconnect-status"></p>

    <button id="add-col">+ Add column</button>
    <div id="columns"></div>

    <script>
        const wsBase = window.APP_CONFIG?.WS_URL || `${window.location.protocol === "https:" ? "wss" : "ws"}://${window.location.host}`;
        const wsUrl = `${wsBase}/ws?role=viewer`;

        const MAX_COLUMNS = 3;

        let socket;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 10;
        const reconnectInterval = 2000;

        const statusElem = document.getElementById("status");
        const reconnectStatusElem = document.getElementById("reconnect-status");
        const columnsElem = document.getElementById("columns");
        const addColBtn = document.getElementById("add-col");

        // Each column: { filter: string|"", dataElem, selectElem, latest: {} }
        const columns = [];
        // Track every topic seen so the filter dropdowns can offer them.
        const seenTopics = new Set();
        // Keep the most recent envelope per topic so a new/changed filter shows data immediately.
        const latestByTopic = {};
        // Most recent envelope of any topic (for "All topics").
        let latestAny = null;

        function createColumn(initialFilter = "") {
            if (columns.length >= MAX_COLUMNS) return;

            const col = document.createElement("div");
            col.className = "column";

            const header = document.createElement("div");
            header.className = "column-header";

            const label = document.createElement("label");
            label.textContent = "Topic:";

            const select = document.createElement("select");

            const removeBtn = document.createElement("button");
            removeBtn.className = "remove-col";
            removeBtn.textContent = "✕";
            removeBtn.title = "Remove column";

            header.appendChild(label);
            header.appendChild(select);
            header.appendChild(removeBtn);

            const dataElem = document.createElement("pre");
            dataElem.textContent = "Waiting for data...";

            col.appendChild(header);
            col.appendChild(dataElem);
            columnsElem.appendChild(col);

            const colState = { filter: initialFilter, dataElem, selectElem: select };

            select.addEventListener("change", () => {
                colState.filter = select.value;
                renderColumn(colState);
            });

            removeBtn.addEventListener("click", () => {
                const idx = columns.indexOf(colState);
                if (idx !== -1) columns.splice(idx, 1);
                col.remove();
                updateAddButton();
            });

            columns.push(colState);
            populateSelect(colState);
            renderColumn(colState);
            updateAddButton();
        }

        function populateSelect(colState) {
            const select = colState.selectElem;
            const current = colState.filter;
            select.innerHTML = "";

            const allOpt = document.createElement("option");
            allOpt.value = "";
            allOpt.textContent = "All topics";
            select.appendChild(allOpt);

            Array.from(seenTopics).sort().forEach((topic) => {
                const opt = document.createElement("option");
                opt.value = topic;
                opt.textContent = topic;
                select.appendChild(opt);
            });

            select.value = current;
        }

        function refreshAllSelects() {
            columns.forEach(populateSelect);
        }

        function renderColumn(colState) {
            const env = colState.filter === ""
                ? latestAny
                : latestByTopic[colState.filter] || null;
            colState.dataElem.textContent = env
                ? JSON.stringify(env, null, 2)
                : "Waiting for data...";
        }

        function updateAddButton() {
            addColBtn.disabled = columns.length >= MAX_COLUMNS;
        }

        function handleEnvelope(env) {
            const topic = env && env.topic;
            let newTopic = false;
            if (typeof topic === "string" && !seenTopics.has(topic)) {
                seenTopics.add(topic);
                newTopic = true;
            }
            if (typeof topic === "string") {
                latestByTopic[topic] = env;
            }
            latestAny = env;
            if (newTopic) refreshAllSelects();

            columns.forEach((colState) => {
                if (colState.filter === "" || colState.filter === topic) {
                    renderColumn(colState);
                }
            });
        }

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                statusElem.textContent = "Connected";
                statusElem.style.color = "green";
                reconnectStatusElem.textContent = "";
                reconnectAttempts = 0;
            };

            socket.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    // Only the raw MQTT pass-through envelopes carry a topic.
                    if (msg && msg.type === "mqtt_message") {
                        handleEnvelope(msg);
                    }
                } catch (err) {
                    console.error("Error parsing JSON:", err);
                }
            };

            socket.onerror = (error) => {
                statusElem.textContent = "Error";
                statusElem.style.color = "red";
                console.error("WebSocket error:", error);
            };

            socket.onclose = () => {
                statusElem.textContent = "Disconnected";
                statusElem.style.color = "orange";
                attemptReconnect();
            };
        }

        function attemptReconnect() {
            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                reconnectStatusElem.textContent = `Reconnecting... (Attempt ${reconnectAttempts} of ${maxReconnectAttempts})`;
                setTimeout(connectWebSocket, reconnectInterval);
            } else {
                reconnectStatusElem.textContent = "Failed to reconnect after multiple attempts.";
                reconnectStatusElem.style.color = "red";
            }
        }

        addColBtn.addEventListener("click", () => createColumn());

        createColumn();
        connectWebSocket();
    </script>
</body>
</html>
