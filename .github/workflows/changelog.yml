name: changelog

# Rebuilds CHANGELOG.md with git-cliff (config: cliff.toml) and opens a PR into
# dev with the result. dev and main only change through PRs, so the workflow
# can't push to them.
#
# Runs when a release or hotfix PR is merged into main (by then
# `Nova.ps1 publish` has tagged the release as nova/<tag>), or by hand from the
# Actions tab. Uses the CHANGELOG_TOKEN secret if it exists (a fine-grained
# token or GitHub App token with contents + pull-requests write), so the PR's
# CI checks run; without it, the PR is opened with the built-in token and a
# lead merges it without waiting for checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Open or update the changelog PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CHANGELOG_TOKEN || github.token }}
          base: dev
          branch: chore/update-changelog
          add-paths: CHANGELOG.md
          commit-message: 'docs(changelog): update changelog'
          title: 'docs(changelog): update changelog'
          body: |
            Regenerated by the `changelog` workflow with git-cliff after a release.
            Only `CHANGELOG.md` changes. Merge with **Squash and merge**.
          delete-branch: true
