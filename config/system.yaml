Sensors:
- name: PGSO
  type: PT
  unit: psi
  range: [0.0, 1000.0]
  binding:
    source: GCS
    hat_id: 0
    channel_id: 0
  convert:
    calibration:
    - [0.99, 0.0]
    - [1.32, 100.0]
    - [1.7, 200.0]
    - [2.1, 300.0]
    - [2.51, 400.0]
    - [2.95, 510.0]
    - [3.34, 600.0]
    - [3.77, 700.0]
    - [4.08, 775.0]
- name: PGS
  type: PT
  unit: psi
  range: [0.0, 1000.0]
  binding:
    source: GCS
    hat_id: 0
    channel_id: 1
  convert:
