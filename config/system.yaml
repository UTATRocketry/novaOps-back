- name: CC-LC
  type: LC
  unit: kg
  range: [0.0, 500.0]
  binding:
    source: GCS
    hat_id: 1
    channel_id: 1
  convert:
    calibration:
    - [1.925, 0.0]
    - [1.995, 177.9]
    - [2.06, 355.6]
- name: TOT
  type: TC
  unit: degC
  range: [-40.0, 125.0]
  binding:
    source: TCS
    hat_id: 0
    channel_id: 0
  convert:
    method: none
- name: PFT
