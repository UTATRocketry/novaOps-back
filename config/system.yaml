
safetyRules:
  critical: # users with "pad" role can use
    - SVOTV: ALL
    - SVFTV: ALL
    - SVGSD: ALL
  hazardous: # requires novaLock to be running and unlocked to use
    #- IMC-V: ALL
    #- IMC-G: ALL
    #- SVBVGS: OPEN
    #- BVGSO: OPEN
    - BVOTP: OPEN
    #- BVFTP: OPEN

Sensors:
  - name: PGSO
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: GCS
      hat_id: 0
      channel_id: 0
    convert:
      method: linear
      calibration: [
        [0.99,0],
        [1.32,100],
        [1.70,200],
        [2.10,300],
        [2.51,400],
        [2.95,510],
        [3.34,600],
        [3.77,700],
        [4.08,775]
      ]
  - name: PGS
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: GCS
      hat_id: 0
      channel_id: 1
    convert:
      method: linear
      calibration: [
        [0.99,0],
        [1.32,100],
        [1.70,200],
        [2.10,300],
        [2.51,400],
        [2.95,510],
        [3.34,600],
        [3.77,700],
        [4.08,775]
      ]
  - name: MOT
    type: LC
    unit: kg
    range: [0, 10]
    binding:
      source: GCS
      hat_id: 0
      channel_id: 2
    convert:
      method: linear
      calibration: [
        [5.2, 2.901],
        [5.01, 2.442],
        [4.72, 1.945],
        [4.45, 1.464],
        [4.11, 0.962],
        [3.84, 0.454],
        [3.59, 0]
      ]
  - name: MFT
    type: LC
    unit: kg
    range: [0, 10]
    binding:
      source: GCS
      hat_id: 0
      channel_id: 7
    convert:
      method: linear
      calibration: [
        [5.2, 2.901],
        [5.01, 2.442],
        [4.72, 1.945],
        [4.45, 1.464],
        [4.11, 0.962],
        [3.84, 0.454],
        [3.59, 0]
      ]
  - name: CC-LC
    type: LC
    unit: kg
    range: [0, 500]
    binding:
      source: GCS
      hat_id: 1
      channel_id: 5
    convert:
      method: linear
      calibration: [
        [1.925, 0],
        [1.995, 177.9],
        [2.06, 355.6]
      ]

  - name: TOT
    type: TC
    unit: degC
    range: [-40, 125]
    binding:
      source: TCS # thermocouple system
      hat_id: 0
      channel_id: 0
    convert:
      method: none

  - name: PFT
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: FAS
      node: EPB_1
      channel: 1
    convert:
      method: linear
      calibration: [ [1, 1],]

  - name: POT
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: FAS
      node: EPB_2
      channel: 1
    convert:
      method: linear
      calibration: [ [1, 1],]

  - name: PCC
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: FAS
      node: EPB_3
      channel: 1
    convert:
      method: linear
      calibration: [ [1, 1],]

Actuators:
  - name: BVGSO
    type: servo
    binding:
      target: GCS
      relay_channel: 2 # optional for servos
      servo_channel: 8
    actions:
      position_aliases: [open, closed] 
      positions: [900, 1900]
      defaultPosition: "closed"
  - name: BVGSD
    type: servo
    binding:
      target: GCS
      relay_channel: 4
      servo_channel: 4
    actions:
      position_aliases: [open, closed] 
      positions: [1300, 1900]
      defaultPosition: "closed"
  - name: SVBVGS
    type: solenoid
    binding:
      target: GCS
      relay_channel: 8
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: SVGSD
    type: solenoid
    binding:
      target: GCS
      relay_channel: 9
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: SVPP
    type: solenoid
    binding:
      target: GCS
      relay_channel: 10
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: IMC-G
    type: powered_device
    binding:
      target: GCS
      relay_channel: 1
    actions:
      relay_type: "nominally_off"
  - name: TANK_HEAT
    type: powered_device
    binding:
      target: GCS
      relay_channel: 11
    actions:
      relay_type: "nominally_off"
  - name: MOV
    type: solenoid
    binding:
      target: GCS
      relay_channel: 12
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: TANK_HEAT_PWR
    type: powered_device
    binding:
      target: GCS
      relay_channel: 13
    actions:
      relay_type: "nominally_off"
  - name: SVFTV
    type: solenoid
    binding:
      target: FAS
      node: EPB_1
      relay_channel: 2
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: SVOTV
    type: solenoid
    binding:
      target: FAS
      node: EPB_2
      relay_channel: 2
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: BVFTP
    type: servo
    binding:
      target: FAS
      node: EPB_1
      relay_channel: 1
      servo_channel: 1
    actions:
      position_aliases: [open, closed] 
      positions: [2050, 1090]
      defaultPosition: "closed"
  - name: BVOTFD
    type: servo
    binding:
      target: FAS
      node: EPB_3
      relay_channel: 1
      servo_channel: 1
    actions:
      position_aliases: ["F", "N", "D"]
      positions: [500, 1500, 2500]
      defaultPosition: "N"
  - name: IMC-V
    type: gpio_device
    binding:
      target: FAS
      node: EPB_3
      gpio_channel: 2
    actions:
      gpio_commands: [ARM, DISARM]
  - name: GPIO_Test_1
    type: gpio_device
    binding:
      target: GCS
      gpio_channel: 1
  - name: GPIO_Test_2
    type: powered_gpio_device
    binding:
      target: GCS
      relay_channel: 14
      gpio_channel: 2


Commands:
  START_DATA_SAVING:
    binding:
      target: GCS
  STOP_DATA_SAVING:
    binding:
      target: GCS
  GET_DATA_FILES:
    binding:
      target: GCS
  POWER_CYCLE_SOFT:
    binding:
      target: FAS
      node: PMB
  SET_FLIGHT_STATE:
    binding:
      target: FAS
      node: FMC
    states: [STANDBY, ARMED]
  GET_LOG_FILES:
    binding:
      target: FAS
      node: FMC
  GET_CONFIG_FILE:
    binding:
      target: FAS
      node: FMC
  SET_CONFIG_FILE:
    binding:
      target: FAS
      node: FMC
  LOAD_CONFIG_FILE:
    binding:
      target: FAS
      node: FMC
  START_CAMERA_RECORDING:
    binding:
      target: FAS
      node: FMC
  STOP_CAMERA_RECORDING:
    binding:
      target: FAS
      node: FMC
  SET_BLUE_RAVEN_STATE:
    binding:
      target: FAS
      node: RAB
      channel: 1
    states: [ARM, DISARM]
  SET_STRATO_STATE:
    binding:
      target: FAS
      node: RAB
      channel: 2
    states: [ARM, DISARM]
