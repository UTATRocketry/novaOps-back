
safetyRules:
  critical: # users with "pad" role can use
    - SVOTV: ALL
    - SVFTV: ALL
    - SVGSD: ALL
  hazardous: # requires novaLock to be running and unlocked to use
    - MOV: ALL
    - MFV: ALL
    #- IMC-V: ALL
    #- IMC-G: ALL
    #- SVBVGS: OPEN
    #- BVGSO: OPEN
    #- BVOTP: OPEN
    #- BVFTP: OPEN

Sensors:
  - name: PGSO
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: GCS
      hat_id: 0
      channel_id: 0
    convert:
      method: linear
      calibration: [
        [0.99,0],
        [1.32,100],
        [1.70,200],
        [2.10,300],
        [2.51,400],
        [2.95,510],
        [3.34,600],
        [3.77,700],
        [4.08,775]
      ]
  - name: PGS
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: GCS
      hat_id: 0
      channel_id: 1
    convert:
      method: linear
      calibration: [
        [0.99,0],
        [1.32,100],
        [1.70,200],
        [2.10,300],
        [2.51,400],
        [2.95,510],
        [3.34,600],
        [3.77,700],
        [4.08,775]
      ]
  - name: PFM
    unit: psi
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: GCS
      hat_id: 0
      channel_id: 4
    convert:
      method: linear
      calibration: [
        [2.01, 4.00],
        [9.14, 633],
      ]

  - name: PVO
    unit: psi
    type: PT
    range: [0, 1000]
    binding:
      source: GCS
      hat_id: 1
      channel_id: 0
    convert:
      method: linear
      calibration: [
        [1.98,0],
        [2.68,100],
        [3.53,200],
        [4.35,300],
        [5.19,400],
        [5.92,500],
        [6.74,600],
        [7.57,700],
        [8.25,800]
      ]
  - name: MOT
    type: LC
    unit: kg
    range: [0, 10]
    binding:
      source: GCS
      hat_id: 0
      channel_id: 6
    convert:
      method: linear
      calibration: [
        [5.2, 2.901],
        [5.01, 2.442],
        [4.72, 1.945],
        [4.45, 1.464],
        [4.11, 0.962],
        [3.84, 0.454],
        [3.59, 0]
      ]
  - name: MFT
    type: LC
    unit: kg
    range: [0, 10]
    binding:
      source: GCS
      hat_id: 0
      channel_id: 7
    convert:
      method: linear
      calibration: [
        [5.2, 2.901],
        [5.01, 2.442],
        [4.72, 1.945],
        [4.45, 1.464],
        [4.11, 0.962],
        [3.84, 0.454],
        [3.59, 0]
      ]
  - name: CC-LC
    type: LC
    unit: kg
    range: [0, 500]
    binding:
      source: GCS
      hat_id: 1
      channel_id: 1
    convert:
      method: linear
      calibration: [
        [1.925, 0],
        [1.995, 177.9],
        [2.06, 355.6]
      ]

  - name: TOT
    type: TC
    unit: degC
    range: [-40, 125]
    binding:
      source: TCS # thermocouple system
      hat_id: 0
      channel_id: 0
    convert:
      method: none

  - name: PFT
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: FAS
      node: EPB_4
      channel: 1
    convert:
      method: linear
      calibration: [ [1, 1],]

  - name: POT
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: FAS
      node: EPB_4
      channel: 0
    convert:
      method: linear
      calibration: [ [1, 1],]

  - name: PCC
    type: PT
    unit: psi
    range: [0, 1000]
    binding:
      source: FAS
      node: EPB_0
      channel: 1
    convert:
      method: linear
      calibration: [ [1, 1],]

Actuators:
  - name: BVGSO
    type: servo
    binding:
      target: GCS
      relay_channel: 2 # optional for servos
      servo_channel: 8
    actions:
      position_aliases: [open, closed] 
      positions: [900, 1900]
      defaultPosition: "closed"
  - name: BVGSD
    type: servo
    binding:
      target: GCS
      relay_channel: 4
      servo_channel: 4
    actions:
      position_aliases: [open, closed] 
      positions: [1300, 1900]
      defaultPosition: "closed"
  - name: SVBVGS
    type: solenoid
    binding:
      target: GCS
      relay_channel: 8
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: SVGSD
    type: solenoid
    binding:
      target: GCS
      relay_channel: 9
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: SVPP
    type: solenoid
    binding:
      target: GCS
      relay_channel: 10
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: IMC-G
    type: powered_device
    binding:
      target: GCS
      relay_channel: 1
    actions:
      relay_type: "nominally_off"
  - name: TANK_HEAT
    type: powered_device
    binding:
      target: GCS
      relay_channel: 11
    actions:
      relay_type: "nominally_off"
  - name: MOV
    type: solenoid
    binding:
      target: GCS
      relay_channel: 12
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_closed"
  - name: TANK_HEAT_PWR
    type: powered_device
    binding:
      target: GCS
      relay_channel: 13
    actions:
      relay_type: "nominally_off"
  - name: FAS_POWER
    type: powered_device
    binding:
      target: GCS
      relay_channel: 14
    actions:
      relay_type: "nominally_off"
  - name: SVFTV
    type: solenoid
    binding:
      target: FAS
      node: EPB_4
      relay_channel: 0
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_open"
  - name: SVOTV
    type: solenoid
    binding:
      target: FAS
      node: EPB_0
      relay_channel: 1
    actions:
      relay_type: "nominally_off"
      solenoid_type: "nominally_open"
  - name: BVFTP
    type: servo
    binding:
      target: FAS
      board_type: EPB
      node: EPB_4
      servo_channel: 1
    actions:
      position_aliases: [open, closed] 
      positions: [2050, 1090]
      defaultPosition: "closed"
  - name: BVOTFD
    type: servo
    binding:
      target: FAS
      node: EPB_0
      relay_channel: 0
      servo_channel: 0
    actions:
      position_aliases: ["F", "N", "D"]
      positions: [500, 1500, 2500]
      defaultPosition: "N"
  - name: IMC-V
    type: gpio_device
    binding:
      target: FAS
      node: EPB_0
      gpio_channel: 0
    actions:
      gpio_commands: [arm, disarm]
      
# chart ranges for the Devices + Flight pages (keyed by board key)
Devices:
  - key: "EPB:0"
    label: Engine Power Board (ox)
    ranges:
      voltage: [0, 30]      # rail-voltage chart (8V4 + 24V0)
      current: [0, 20]      # rail-current chart
  - key: "EPB:4"
    label: Engine Power Board (fuel)
    ranges:
      voltage: [0, 30]
      current: [0, 20]
  - key: "PMB:0"
    label: Power Management Board
    ranges:
      voltage: [0, 30]      # VMAIN/VBATT/VGSE chart
      temperature: [0, 80]  # ambient/buck/boost chart
  - key: "FMC:0"
    label: Flight Management Computer
    ranges:                 # these drive the Flight dashboard charts
      accel: [-16, 16]
      gyro: [-2000, 2000]
      mag: [-100, 100]
      accelHi: [-100, 100]
      altitude: [0, 5000]

# composable FAS transmit packets (drive Console → Transmit Packet)
Packets:
  - name: PWM Set (servo)
    op: pwm_set
    fields:
      - { key: board_id, type: number, default: 0 }
      - { key: channel,  type: number, default: 0 }
      - { key: pulse_us, type: number, default: 1500 }
      - { key: period_us, type: number, default: 20000 }
  - name: Load Switch (relay)
    op: load_sw_set
    fields:
      - { key: board_id, type: number, default: 0 }
      - { key: channel,  type: number, default: 0 }
      - { key: enable,   type: bool,   default: false }
      - { key: hold_ms,  type: number, default: 0 }
  - name: IMC Arm
    op: imc_arm
    fields:
      - { key: board_id, type: number, default: 0 }
      - { key: pulse_ms, type: number, default: 0 }
  - name: Discover
    op: discover
    fields: []

Procedures:
  - name: Hotfire
    steps:
      - Perform actuator and sensor checkouts
      - Verify all valves closed and all sensors nominal
      - Complete low pressure leak checks
      - Complete high pressure leak checks
      - Complete Ox fill
      - Pressurize Ox Tank and Fuel Tank
      - Dump Fill lines
      - Perform GO/NO-GOs
      - Connect Launch Controller
      - Arm IMCs
      - GO for ignition
  - name: Cold Flow
    steps:
      - Perform actuator and sensor checkouts
      - Verify all valves closed and all sensors nominal
      - Complete low pressure leak checks
      - Complete high pressure leak checks
      - Complete Ox fill
      - Pressurize Ox Tank and Fuel Tank
      - Dump Fill lines
      - Perform GO/NO-GOs
      - Arm IMCs
      - Pull Burn Wire