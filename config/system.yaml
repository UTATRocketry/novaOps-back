Actuators:
- name: BVGSO
  type: servo
  binding:
    target: GCS
    relay_channel: 5
    servo_channel: 9
  actions:
    position_aliases: [open, closed]
    positions: [900, 1900]
    default_position: closed
- name: BVGSP
  type: servo
  binding:
    target: GCS
    relay_channel: 2
    servo_channel: 8
  actions:
    position_aliases: [open, closed]
    positions: [900, 1700]
    default_position: closed
- name: BVGSD
  type: servo
  binding:
    target: GCS
    relay_channel: 4
    servo_channel: 4
  actions:
    position_aliases: [open, closed]
    positions: [1300, 1900]
    default_position: closed
- name: SVBVGS
  type: solenoid
  binding:
    target: GCS
    relay_channel: 8
  actions:
    relay_type: nominally_off
    solenoid_type: nominally_closed
- name: SVFLD
  type: solenoid
  binding:
    target: GCS
    relay_channel: 9
  actions:
    relay_type: nominally_off
    solenoid_type: nominally_closed
- name: SVPP
  type: solenoid
  binding:
    target: GCS
    relay_channel: 10
  actions:
    relay_type: nominally_off
    solenoid_type: nominally_closed
- name: IMC-G
  type: powered_device
  binding:
    target: GCS
    relay_channel: 6
  actions:
    relay_type: nominally_off
- name: TANK_HEAT
  type: powered_device
  binding:
    target: GCS
    relay_channel: 11
  actions:
    relay_type: nominally_off
- name: MOV
  type: solenoid
  binding:
    target: GCS
    relay_channel: 12
  actions:
    relay_type: nominally_off
    solenoid_type: nominally_closed
- name: TANK_HEAT_PWR
  type: powered_device
  binding:
    target: GCS
    relay_channel: 13
  actions:
    relay_type: nominally_off
- name: uncFTP
  type: servo
  binding:
    target: GCS
    relay_channel: 3
    servo_channel: 3
  actions:
    position_aliases: [open, closed]
    positions: [2050, 1090]
    default_position: close
- name: GSFTP
  type: servo
  binding:
    target: GCS
    relay_channel: 0
    servo_channel: 6
  actions:
    position_aliases: [open, closed]
    positions: [1950, 950]
    default_position: closed
    relay_type: nominally_off
- name: SVFTV
  type: solenoid
  binding:
    target: FAS
    node: EPB_4
    relay_channel: 0
  actions:
    relay_type: nominally_off
    solenoid_type: nominally_open
- name: SVOTV
  type: solenoid
  binding:
    target: FAS
    node: EPB_2
    relay_channel: 0
  actions:
    relay_type: nominally_off
    solenoid_type: nominally_open
- name: BVFTP
  type: servo
  binding:
    target: FAS
    node: EPB_4
    board_type: EPB
    relay_channel: 1
    servo_channel: 1
  actions:
    position_aliases: [open, closed]
    positions: [2000, 1050]
    default_position: closed
- name: BVOTFD
  type: servo
  binding:
    target: FAS
    node: EPB_0
    relay_channel: 0
    servo_channel: 0
  actions:
    position_aliases: [F, N, D]
    positions: [2400, 1500, 500]
    default_position: N
- name: IMC-V
  type: gpio_device
  binding:
    target: FAS
    node: EPB_0
    gpio_channel: 0
  actions:
    gpio_commands: [arm, disarm]
safetyRules:
  critical:
  - SVOTV: ALL
  - SVFTV: ALL
  - SVGSD: ALL
  hazardous:
  - MOV: ALL
  - MFV: ALL
Procedures:
- name: Hotfire
  steps: [Perform actuator and sensor checkouts, Verify all valves closed and all
      sensors nominal, Complete low pressure leak checks, Complete high pressure leak
      checks, Complete Ox fill, Pressurize Ox Tank and Fuel Tank, Dump Fill lines,
    Perform GO/NO-GOs, Connect Launch Controller, Arm IMCs, GO for ignition]
- name: Cold Flow
  steps: [Perform actuator and sensor checkouts, Verify all valves closed and all
      sensors nominal, Complete low pressure leak checks, Complete high pressure leak
      checks, Complete Ox fill, Pressurize Ox Tank and Fuel Tank, Dump Fill lines,
    Perform GO/NO-GOs, Arm IMCs, Pull Burn Wire]
Devices:
- key: EPB:0
  label: Engine Power Board (ox)
  ranges:
    voltage: [0.0, 30.0]
    current: [0.0, 20.0]
- key: EPB:4
  label: Engine Power Board (fuel)
  ranges:
    voltage: [0.0, 30.0]
    current: [0.0, 20.0]
- key: PMB:0
  label: Power Management Board
  ranges:
    voltage: [0.0, 30.0]
    temperature: [0.0, 80.0]
- key: FMC:0
  label: Flight Management Computer
  ranges:
    accel: [-16.0, 16.0]
    gyro: [-2000.0, 2000.0]
    mag: [-100.0, 100.0]
    accelHi: [-100.0, 100.0]
    altitude: [0.0, 5000.0]
Packets:
- name: PWM Set (servo)
  op: pwm_set
  fields:
  - key: board_id
    type: number
    default: 0
  - key: channel
    type: number
    default: 0
  - key: pulse_us
    type: number
    default: 1500
  - key: period_us
    type: number
    default: 20000
- name: Load Switch (relay)
  op: load_sw_set
  fields:
  - key: board_id
    type: number
    default: 0
  - key: channel
    type: number
    default: 0
  - key: enable
    type: bool
    default: false
  - key: hold_ms
    type: number
    default: 0
- name: IMC Arm
  op: imc_arm
  fields:
  - key: board_id
    type: number
    default: 0
  - key: pulse_ms
    type: number
    default: 0
- name: Discover
  op: discover
